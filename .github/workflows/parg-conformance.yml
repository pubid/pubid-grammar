name: parg-conformance
on:
  push:
    branches: [main, ocp-and-schemas]
  pull_request:
  workflow_dispatch: {}

env:
  RUBY_REF: main
  RS_REF: main
  TS_REF: main

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Compile every grammar (lint + validity + tests)
        run: |
          git clone --depth 1 --branch "$RUBY_REF" \
            https://github.com/parsanol/parsanol-ruby ../parsanol-ruby
          cd ../parsanol-ruby
          bundle install --path vendor/bundle
          # The script is not executable in the checkout and its default
          # PARSANOL_RUBY path does not exist on the runner — run it under
          # the cloned bundle (whose install built the native extension).
          bundle exec ruby "$GITHUB_WORKSPACE/scripts/regen-contracts.rb"
          cd "$GITHUB_WORKSPACE"
          # A grammar change must carry its regenerated contracts: the
          # committed schemas/corpora pin artifact checksums and frozen
          # corpus cases, so drift here means the PR forgot the regen
          # (the #33 gap — the regen ran with "|| true" and nothing
          # compared its output, so a round-stale contracts set passed).
          git diff --exit-code -- schemas corpora || {
            echo "::error::schemas/ or corpora/ are stale against grammars/ — run rake contracts:regen and commit the output"
            exit 1
          }
          bundle exec ruby -Ilib -e '
            require "parsanol"
            Dir.glob(File.expand_path(ARGV[0])).sort.each do |f|
              name = File.basename(f, ".parg")
              document = Parsanol::PARG::Parser.new(File.read(f)).parse
              Parsanol::PARG::Imports.merge!(document, [File.dirname(f)])
              Parsanol::PARG::Compiler.compile(document, tables_dir: File.join(File.dirname(f), "../tables"))
              puts name
            end' "$GITHUB_WORKSPACE/grammars/*.parg"
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust VM gate (docker, 4GB cap)
        run: |
          git clone --depth 1 --branch "$RS_REF" \
            https://github.com/parsanol/parsanol-rs ../parsanol-rs
          cd ../parsanol-rs
          PARG_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts" \
            ./docker-test.sh test -p parsanol --test parg_bindings
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TS/wasm gate
        run: |
          git clone --depth 1 --branch "$TS_REF" \
            https://github.com/pubid/pubid-ts ../pubid-ts
          cd ../pubid-ts
          npm install
          npm run build
          npx tsc -p tsconfig.test.json
          PARG_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts" \
            node --test dist-test/test/parg-runtime.test.js
