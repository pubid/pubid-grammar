name: parg-conformance
on:
  push:
    branches: [main, ocp-and-schemas]
  pull_request:
  workflow_dispatch: {}

env:
  # Post brace-body rule forms (ruby#311) and the advisory lint split:
  # the compiler must parse brace-form grammars and reproduce the
  # committed contracts byte-for-byte.
  # The released compiler the artifacts are baked with. ruby#361's
  # v1.3.114 carries the numeric editions (the canonical `edition 2`
  # header, the integer envelope field) and the v2 whitespace-class
  # glue fix: %xNN whitespace rules stay anonymous in edition-2 trees.
  PARSANOL_VERSION: 1.3.114
  RS_REF: main
  TS_REF: main

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
      - name: Compile every grammar (lint + validity + tests)
        run: |
          gem install parsanol -v "$PARSANOL_VERSION"
          ruby "$GITHUB_WORKSPACE/scripts/regen-contracts.rb"
          # A grammar change must carry its regenerated contracts: the
          # committed schemas/corpora pin artifact checksums and frozen
          # corpus cases, so drift here means the PR forgot the regen
          # (the #33 gap — the regen ran with "|| true" and nothing
          # compared its output, so a round-stale contracts set passed).
          git diff --exit-code -- schemas corpora || {
            echo "::error::schemas/ or corpora/ are stale against grammars/ — run rake contracts:regen and commit the output"
            exit 1
          }
          for f in "$GITHUB_WORKSPACE"/grammars/*.parg; do
            parsanol parg test "$f" || exit 1
          done
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust VM gate (docker, 4GB cap)
        run: |
          git clone --depth 1 --branch "$RS_REF" \
            https://github.com/parsanol/parsanol-rs ../parsanol-rs
          cd ../parsanol-rs
          PARG_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts" \
            ./docker-test.sh test -p parsanol --test parg_bindings
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TS/wasm gate
        run: |
          git clone --depth 1 --branch "$TS_REF" \
            https://github.com/pubid/pubid-ts ../pubid-ts
          cd ../pubid-ts
          npm install
          npm run build
          npx tsc -p tsconfig.test.json
          PARG_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts" \
            node --test dist-test/test/parg-runtime.test.js
      # The F4 corpora record the tree the NATIVE engine produced for
      # every case; this gate parses each one through the WASM engine and
      # fails with flavor#index + input + want/got on any drift. It also
      # requires every artifact's freshness envelope and, when the
      # grammar sources are present, compiledFrom() to hold (TODO.SOTA/04).
      - name: Cross-engine corpus gate (native expectations vs wasm)
        run: |
          cd ../pubid-ts
          PARG_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts" \
          PARG_CORPORA_DIR="$GITHUB_WORKSPACE/corpora" \
          PARG_GRAMMAR_DIR="$GITHUB_WORKSPACE/grammars" \
            node scripts/corpus-parity.mjs
